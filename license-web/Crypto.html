<script>
/*
 * EggVyapar license keys in the browser — the same format as domain/license/LicenseFormat.kt:
 *   key = "EV1-" + Crockford Base32( payload ‖ signature ), grouped by 5
 *   payload = version 1 ‖ license id (5 bytes) ‖ device limit (1 byte) ‖ device hash (10 bytes)
 *   signature = ECDSA P-256 / SHA-256 over ("EGGVYAPAR-LICENSE-V1" ‖ payload), raw r ‖ s (64 bytes)
 * WebCrypto's ECDSA signature is already raw r ‖ s, exactly what the app expects.
 */
var EV = (function () {
  var ALPHABET = '0123456789ABCDEFGHJKMNPQRSTVWXYZ';
  var DOMAIN = new TextEncoder().encode('EGGVYAPAR-LICENSE-V1');

  function base32(bytes) {
    var out = '', buffer = 0, bits = 0;
    for (var i = 0; i < bytes.length; i++) {
      buffer = ((buffer << 8) | bytes[i]) & 0xFFFF;
      bits += 8;
      while (bits >= 5) { out += ALPHABET[(buffer >> (bits - 5)) & 31]; bits -= 5; }
    }
    if (bits > 0) out += ALPHABET[(buffer << (5 - bits)) & 31];
    return out;
  }

  function unbase32(text) {
    var out = [], buffer = 0, bits = 0;
    var s = text.toUpperCase();
    for (var i = 0; i < s.length; i++) {
      var c = s[i];
      if (c === '-' || /\s/.test(c)) continue;
      if (c === 'O') c = '0';
      if (c === 'I' || c === 'L') c = '1';
      var v = ALPHABET.indexOf(c);
      if (v < 0) return null;
      buffer = ((buffer << 5) | v) & 0xFFFF;
      bits += 5;
      if (bits >= 8) { out.push((buffer >> (bits - 8)) & 0xFF); bits -= 8; }
    }
    return new Uint8Array(out);
  }

  function group(text, n) { return text.match(new RegExp('.{1,' + n + '}', 'g')).join('-'); }

  /** The 10-byte device hash in a Device code, or null when it is not one. */
  function parseDeviceCode(code) {
    var bytes = unbase32(code || '');
    return bytes && bytes.length === 10 ? bytes : null;
  }

  function deviceCode(hash) { return group(base32(hash), 4); }

  function licenseIdText(id) { return 'L-' + base32(id); }

  function parseLicenseId(text) {
    var bytes = unbase32(String(text || '').trim().toUpperCase().replace(/^L-/, ''));
    return bytes && bytes.length === 5 ? bytes : null;
  }

  function randomLicenseId() { return crypto.getRandomValues(new Uint8Array(5)); }

  function fromBase64(b64) {
    var bin = atob(b64.trim()), out = new Uint8Array(bin.length);
    for (var i = 0; i < bin.length; i++) out[i] = bin.charCodeAt(i);
    return out;
  }

  function importSigningKey(pkcs8Base64) {
    return crypto.subtle.importKey('pkcs8', fromBase64(pkcs8Base64), { name: 'ECDSA', namedCurve: 'P-256' }, false, ['sign']);
  }

  /** The EV1- key for one device. */
  async function makeKey(signingKey, licenseId, maxDevices, deviceHash) {
    if (!(maxDevices >= 1 && maxDevices <= 255)) throw new Error('Devices allowed must be 1-255');
    var payload = new Uint8Array(17);
    payload[0] = 1;
    payload.set(licenseId, 1);
    payload[6] = maxDevices;
    payload.set(deviceHash, 7);
    var signed = new Uint8Array(DOMAIN.length + payload.length);
    signed.set(DOMAIN, 0);
    signed.set(payload, DOMAIN.length);
    var signature = new Uint8Array(await crypto.subtle.sign({ name: 'ECDSA', hash: 'SHA-256' }, signingKey, signed));
    if (signature.length !== 64) throw new Error('Unexpected signature length ' + signature.length);
    var all = new Uint8Array(payload.length + 64);
    all.set(payload, 0);
    all.set(signature, payload.length);
    return 'EV1-' + group(base32(all), 5);
  }

  return {
    parseDeviceCode: parseDeviceCode, deviceCode: deviceCode, licenseIdText: licenseIdText,
    parseLicenseId: parseLicenseId, randomLicenseId: randomLicenseId, importSigningKey: importSigningKey, makeKey: makeKey,
  };
})();
</script>
